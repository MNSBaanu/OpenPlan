name = "openplan-collab"
main = "src/index.js"
compatibility_date = "2025-04-01"

[vars]
# Websites allowed to open a live session. Separate several with commas. Use "*" only while testing.
ALLOWED_ORIGINS = "https://openplan-xi.vercel.app"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# SQLite-backed Durable Objects are available on the free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
