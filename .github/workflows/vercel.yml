name: Deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_ENV: ${{ github.event_name == 'push' && 'production' || 'preview' }}
  VERCEL_PROD_FLAG: ${{ github.event_name == 'push' && '--prod' || '' }}

# Only the newest commit should be deployed, so an older deploy is cancelled when a newer one starts.
# (Otherwise a slow old deploy could finish last and replace a newer site.)
concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Pull requests from forks and from Dependabot don't receive the Vercel secrets, so only the checks run for them.
    env:
      CAN_DEPLOY: ${{ github.event_name == 'push' || (!github.event.pull_request.head.repo.fork && github.actor != 'dependabot[bot]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Audit dependencies
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      # Deploying builds the app too; fork pull requests skip that, so check the build here.
      - name: Build check
        if: env.CAN_DEPLOY != 'true'
        run: npm run build

      - name: Install Vercel CLI
        if: env.CAN_DEPLOY == 'true'
        run: npm install --global vercel@65.16.0

      - name: Pull Vercel project settings
        if: env.CAN_DEPLOY == 'true'
        run: vercel pull --yes --environment=$VERCEL_ENV --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        if: env.CAN_DEPLOY == 'true'
        run: vercel build $VERCEL_PROD_FLAG --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        if: env.CAN_DEPLOY == 'true'
        run: vercel deploy --prebuilt $VERCEL_PROD_FLAG --token=${{ secrets.VERCEL_TOKEN }}
