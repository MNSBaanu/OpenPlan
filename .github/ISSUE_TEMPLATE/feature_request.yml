name: Feature request
description: An idea to make OpenPlan better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the job first, then the feature you imagine.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: dropdown
    id: scope
    attributes:
      label: Would you like to build it?
      options:
        - I would like to try, with some guidance
        - I would rather someone else did
